[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lb2tidal"
version = "1.0.0"
description = "Mirror ListenBrainz recommendation playlists into Tidal"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Quentin PAYET" }]
keywords = ["listenbrainz", "tidal", "playlist", "music"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "tidalapi>=0.8.11,<0.9",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/Quentin0312/lb2tidal"
Issues = "https://github.com/Quentin0312/lb2tidal/issues"

[project.scripts]
lb2tidal = "lb2tidal.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lb2tidal"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
